<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <title>Setlistic</title>
    <!-- Offline-first: everything is bundled; only the YouTube player is framed from the network
         (chord pages load in a <webview>, a separate guest page outside this policy) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src https://www.youtube-nocookie.com"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
